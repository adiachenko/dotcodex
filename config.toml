model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_instructions_file = "~/.codex/SYSTEM.custom.md"
model_verbosity = "medium"
model_context_window = 372000
model_auto_compact_token_limit = 334800

service_tier = "priority"

sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
web_search = "live"

commit_attribution = ""

[sandbox_workspace_write]
network_access = true

[agents]
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"
max_threads = 10
max_depth = 1

[desktop]
ambient-suggestions-enabled = false
followUpQueueMode = "steer"
git-branch-prefix = ""
git-pull-request-merge-method = "squash"
git-create-pull-request-as-draft = false
git-commit-instructions = "Write the commit title as a short imperative phrase. Leave the commit description empty."
git-pr-instructions = "Write the PR title as a short imperative phrase naming the main change. Leave the PR description empty."
